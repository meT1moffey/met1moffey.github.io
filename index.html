<!DOCTYPE html>
<html>
    <head>
        <title>Salad Maker 9000</title>
        <script src="/scripts/main.js"></script>
        <link href="/styles/sheets.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div id="header">
            <form id="save_rec">
                <label>
                    Введите свое имя <input type="text" id="name">
                </label>
                <input type="submit" value="Сохранить результат">
                Посмотреть таблицу можно ниже
            </form>
            <span id="feedback"></span>
        </div>
        <div id="content">
            <div>
                Счёт <span id="score"></span>
                <span id="hp"></span>
                <div id="replay">
                    <button id="replay_btn">Играть заново</button>
                </div>
            </div>
        </div>
        <div id="footer">
            <button id="showtable">Показывать таблицу</button>
            <table id="record_table">
            </table>
        </div>
    </body>
</html>
